<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>3D Store — Alrehman Medical Store</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:#efe3c8;color:#241d12;overflow:hidden}
  #gl{position:fixed;inset:0}
  #gl canvas{display:block;width:100%;height:100%;touch-action:none}
  /* back chevron (symbol only — no text on screen except the gate sign) */
  #backBtn{position:fixed;left:.7rem;top:.7rem;z-index:120;width:2.6rem;height:2.6rem;border-radius:50%;border:1.5px solid rgba(255,255,255,.65);background:rgba(20,26,22,.45);color:#fff;font-size:1.5rem;font-weight:800;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
  #backBtn:active{transform:translateY(1px)}

  /* ---------- entry: sheeshe wala darwaza (V26 flow, kept) ---------- */
  #entry{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem;background:linear-gradient(180deg,#efe3c8 0%,#e9dcbf 62%,#d8cfba 62.2%,#b9b4a8 100%);transition:opacity .7s ease}
  #entry.gone{opacity:0;pointer-events:none}
  .ent-sign{background:#fffdf6;border:3px solid #0e7a6d;border-radius:10px;box-shadow:0 8px 24px rgba(52,38,14,.25);padding:.55rem 1.4rem .65rem;display:flex;align-items:center;gap:.8rem}
  .ent-cross{position:relative;flex:0 0 auto;width:30px;height:30px}
  .ent-cross::before,.ent-cross::after{content:"";position:absolute;background:#c0272d;border-radius:3px}
  .ent-cross::before{left:50%;top:0;width:10px;height:30px;transform:translateX(-50%)}
  .ent-cross::after{top:50%;left:0;height:10px;width:30px;transform:translateY(-50%)}
  .ent-med{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;letter-spacing:.01em;color:#0e7a6d;line-height:1.05;text-align:left}
  #doorBtn{position:relative;width:min(600px,92vw);height:min(58vh,520px);min-height:300px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #doorBtn:focus-visible{outline:3px solid #e85d26;outline-offset:4px;border-radius:6px}
  .ent-frame{position:absolute;inset:0;border:12px solid #0f6f6a;border-bottom-width:16px;border-radius:6px 6px 2px 2px;box-shadow:0 18px 44px rgba(30,25,10,.35),inset 0 0 0 2px rgba(0,0,0,.15);overflow:hidden;background:linear-gradient(180deg,#cfe8f2 0%,#a8c8d4 55%,#8fb2bd 100%)}
  .ent-frame::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.06) 34%,rgba(255,255,255,0) 55%,rgba(255,255,255,.28) 78%,rgba(255,255,255,0) 100%);z-index:3;pointer-events:none}
  .ent-frame::after{content:"";position:absolute;left:0;right:0;top:46%;height:12px;background:#0f6f6a;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.25)}
  .ent-inside{position:absolute;inset:0;background:linear-gradient(180deg,#f6ead0 0%,#ecd9ac 58%,#d9c491 100%);opacity:0;transition:opacity .5s}
  .ent-inside::before{content:"";position:absolute;left:6%;right:6%;top:16%;height:52%;background:repeating-linear-gradient(90deg,#c0272d 0 5px,#fdfaf2 5px 64px),repeating-linear-gradient(0deg,transparent 0 44px,#c0272d 44px 48px);opacity:.55;border:4px solid #c0272d}
  #entry.open .ent-inside{opacity:1}
  .door{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(180deg,rgba(207,232,242,.92),rgba(150,190,205,.92));border:3px solid rgba(10,70,66,.55);transition:transform 1.15s cubic-bezier(.6,.02,.3,1);z-index:4}
  .door.left{left:0;border-right-width:2px}
  .door.right{right:0;border-left-width:2px}
  .door::after{content:"";position:absolute;top:44%;width:9px;height:74px;border-radius:5px;background:#37474f;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .door.left::after{right:14px}
  .door.right::after{left:14px}
  #entry.open .door.left{transform:translateX(-97%)}
  #entry.open .door.right{transform:translateX(97%)}
  @media (prefers-reduced-motion: reduce){ .door{transition:none} #entry{transition:none} }
</style>
</head>
<body>
<div id="entry" role="dialog" aria-label="Alrehman Medical Store ka darwaza">
  <div class="ent-sign" aria-hidden="true">
    <span class="ent-cross"></span>
    <span class="ent-med">Medicines</span>
  </div>
  <button id="doorBtn" type="button" aria-label="Sheeshe wala darwaza kholein — 3D store ke andar jayein">
    <span class="ent-frame">
      <span class="ent-inside"></span>
      <span class="door left"></span>
      <span class="door right"></span>
    </span>
  </button>
</div>
<button id="backBtn" type="button" aria-label="Back" onclick="location.href='index.html'">‹</button>
<div id="gl" aria-label="3D store — andar ghoom kar dekhein"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
/* =====================================================================
   Alrehman Medical Store — 3D Store (Phase 1: look / room + door flow)
   Room built as Three.js geometry from the verified per-wall inventory
   (rack_inventory_2026-11-23.md). NO mesh file, NO photos as the room —
   the room IS geometry; real photos are used ONLY as rack-face textures
   so the shelves look like his real room (white racks, RED trim, glass
   shelves, real medicine boxes). NO people. NO medicine details.
   Gate text is "Medicines" only — no other text anywhere on screen.
   Wall map (Sir, 24 Nov 02:14 — BINDING):
     entry (glass door) = RIGHT side of the front wall (V59)
     main rack wall = the wall you face on entering (V99)
     left side = V38 walkthrough wall · glass front = V64
   Room coords: X -6..+6 (long), Z -3..+3 (deep), height 3.6.
     front glass wall Z=+3 · main rack wall Z=-3
     left wall X=-6 · right wall X=+6 · entry door x +3.2..+5.2
   ===================================================================== */
(function(){
'use strict';

/* ---------- renderer / scene / camera ---------- */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xefe3c8);
scene.fog = new THREE.Fog(0xefe3c8, 26, 46);
var camera = new THREE.PerspectiveCamera(55, 1, 0.1, 120);
var HOME_POS = new THREE.Vector3(4.2, 1.6, 1.8);   /* just inside the entry (right side) */
var HOME_TGT = new THREE.Vector3(-5, 1.5, -1);      /* left wall first, main (5x7) rack wall also in frame (Sir, 24 Nov 12:05: saamne wali deewar bhi show ho) */
camera.position.set(4.2, 1.6, 4.6);                 /* start: just outside the door */
camera.lookAt(HOME_TGT);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('gl').appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 0.8;
controls.maxDistance = 10.5; /* MUST stay >= the home distance (~10.36 from HOME_TGT): a smaller value yanks the camera forward off HOME_POS the moment controls enable (harness-proven 24 Nov 12:06). The clampCamera() box below — not this distance — is what keeps the camera inside the room. */
controls.maxPolarAngle = 1.62;
controls.enabled = false; /* enabled after entering */

/* Sir, 24 Nov ~12:00 — camera NEVER leaves the room: after entering, the
   camera is clamped to the free interior every frame, so dragging
   left-right can no longer push it through a wall (room seen from
   outside like a box) or into a rack. Bounds sit just in front of the
   rack faces (back rack face z -2.58, left rack face x -5.58, front
   shelves z 2.67) and below the ceiling. Gated on controls.enabled so
   the entry fly-through (which starts outside the door) is untouched. */
function clampCamera(){
  if (!controls.enabled) return;
  var p = camera.position;
  p.x = Math.max(-5.5, Math.min(5.5, p.x)); /* 5.5: right rack face is x 5.58 */
  p.y = Math.max(0.4, Math.min(3.3, p.y));
  p.z = Math.max(-2.5, Math.min(2.55, p.z));
}

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xfff6e6, 0.85));
var hemi = new THREE.HemisphereLight(0xfff6e6, 0x8a7a5e, 0.55); scene.add(hemi);
var key = new THREE.DirectionalLight(0xfff1d6, 1.5);
key.position.set(5, 8, 6); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
scene.add(key);
var fill = new THREE.DirectionalLight(0xdfeeff, 0.45); fill.position.set(-6, 5, -4); scene.add(fill);
var front = new THREE.DirectionalLight(0xffffff, 0.35); front.position.set(0, 4, 9); scene.add(front);

/* ---------- materials ---------- */
function mat(c, r, m){ return new THREE.MeshStandardMaterial({color:c, roughness:(r==null?0.85:r), metalness:(m||0)}); }
var M = {
  wall:   mat(0xe6d9bd, 0.95),
  teal:   mat(0x2f7f8a, 0.9),          /* teal-blue lower half */
  ceil:   mat(0xead9b8, 0.95),
  white:  mat(0xfdfaf2, 0.85),        /* rack white */
  red:    mat(0xc0272d, 0.6),         /* rack RED trim */
  shelfW: mat(0xf6efdd, 0.8),
  wood:   mat(0x8a6d4b, 0.85),        /* bench / counter wood */
  darkWood: mat(0x5a4230, 0.85),
  tealFrame: mat(0x0f6f6a, 0.45, 0.25),
  glass:  new THREE.MeshStandardMaterial({color:0xbfe0ea, roughness:0.08, metalness:0.1, transparent:true, opacity:0.28, side:THREE.DoubleSide, depthWrite:false}),
  glassShelf: new THREE.MeshStandardMaterial({color:0xd8ecf2, roughness:0.05, metalness:0.1, transparent:true, opacity:0.32, side:THREE.DoubleSide, depthWrite:false}),
  black:  mat(0x1a1a1a, 0.5, 0.3),
  grey:   mat(0x9aa0a3, 0.9),
  acWhite:mat(0xf2f2f2, 0.6),
  green:  mat(0x2e7d4f, 0.8),
  beige:  mat(0xd9c9a8, 0.95),
  redBoard: mat(0xd21f26, 0.7),
  paper:  mat(0xffffff, 0.9),
  curtain:mat(0x4a4238, 0.95),
  road:   mat(0x4c4f52, 0.98),
  sky:    new THREE.MeshStandardMaterial({color:0xdceef7, emissive:0xcfe6f2, emissiveIntensity:0.55}),
  bldg:   mat(0xf4f1e8, 0.95)
};

/* ---------- textures (real photos, rack faces only) ---------- */
var texLoader = new THREE.TextureLoader();
function loadTex(path, fallback){
  var t = texLoader.load(path, function(){}, undefined, function(){ /* keep fallback */ });
  t.encoding = THREE.sRGBEncoding;
  return t;
}
var texBack  = loadTex('textures/tex_back.jpg');   /* V99 — real main rack wall */
var texLeft  = loadTex('textures/tex_left.jpg');   /* P08 — real rack close-up */
var texFront = loadTex('textures/tex_front.jpg');  /* P02 — real medicine boxes */
var backMat  = new THREE.MeshStandardMaterial({map:texBack, roughness:0.9});
var leftMat  = new THREE.MeshStandardMaterial({map:texLeft, roughness:0.9});
var frontMat = new THREE.MeshStandardMaterial({map:texFront, roughness:0.9});

/* floor: grey marble-pattern tiles, procedural canvas */
function floorTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 512;
  var g = c.getContext('2d');
  g.fillStyle = '#b9bcbe'; g.fillRect(0, 0, 512, 512);
  var i, x, y;
  for (i = 0; i < 2600; i++){ /* marble speckle */
    g.fillStyle = 'rgba(' + (120 + Math.random()*90|0) + ',' + (120 + Math.random()*90|0) + ',' + (125 + Math.random()*90|0) + ',0.16)';
    g.fillRect(Math.random()*512, Math.random()*512, 2 + Math.random()*3, 2 + Math.random()*3);
  }
  g.strokeStyle = 'rgba(90,95,100,0.35)'; g.lineWidth = 1.4; /* veins */
  for (i = 0; i < 14; i++){
    g.beginPath(); x = Math.random()*512; y = Math.random()*512; g.moveTo(x, y);
    for (var s = 0; s < 5; s++){ x += (Math.random()-0.5)*220; y += (Math.random()-0.5)*220; g.lineTo(x, y); }
    g.stroke();
  }
  g.strokeStyle = 'rgba(70,72,75,0.85)'; g.lineWidth = 3; /* tile grid, 4x4 */
  for (i = 0; i <= 4; i++){
    g.beginPath(); g.moveTo(i*128, 0); g.lineTo(i*128, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i*128); g.lineTo(512, i*128); g.stroke();
  }
  var t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 3);
  return t;
}

/* ---------- build helpers ---------- */
var room = new THREE.Group(); scene.add(room);
function box(w, h, d, material, x, y, z, parent){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || room).add(m);
  return m;
}
function plane(w, h, material, x, y, z, ry, parent){
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(x, y, z); if (ry) m.rotation.y = ry;
  m.receiveShadow = true;
  (parent || room).add(m);
  return m;
}

/* ---------- room shell: floor, ceiling, walls ---------- */
(function shell(){
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 6),
    new THREE.MeshStandardMaterial({map:floorTexture(), roughness:0.9}));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; room.add(floor);
  box(12, 0.12, 6, M.ceil, 0, 3.66, 0);                       /* ceiling slab */
  box(12, 0.1, 6, M.ceil, 0, 3.58, 0);                        /* ceiling face */
  /* back wall (main rack wall sits in front of it) */
  box(12, 3.6, 0.12, M.wall, 0, 1.8, -3.06);
  box(12, 1.1, 0.14, M.teal, 0, 0.55, -3.05);                 /* teal lower half */
  /* left wall */
  box(0.12, 3.6, 6, M.wall, -6.06, 1.8, 0);
  box(0.14, 1.1, 6, M.teal, -6.05, 0.55, 0);
  /* right wall */
  box(0.12, 3.6, 6, M.wall, 6.06, 1.8, 0);
  box(0.14, 1.1, 6, M.teal, 6.05, 0.55, 0);
  /* front wall pieces (glass frontage is built by glassFront below) */
  box(12, 0.5, 0.12, M.wall, 0, 3.35, 3.06);                  /* lintel above everything */
  box(9.2, 1.1, 0.14, M.teal, -1.4, 0.55, 3.05);             /* teal lower half, left of door */
  box(0.8, 1.1, 0.14, M.teal, 5.6, 0.55, 3.05);              /* teal lower half, right of door */
  /* ceiling: textured beige + one white diagonal beam/pipe (room diagonal) */
  var beam = box(11, 0.14, 0.18, mat(0xf6f2e8, 0.9), 0, 3.52, 0);
  beam.rotation.y = 0.464;
  /* long tube light + bare bulb holders */
  var tube = box(1.6, 0.06, 0.12, new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff6da, emissiveIntensity:0.9}), 0, 3.5, 1.2);
  tube.castShadow = false;
  box(0.09, 0.12, 0.09, M.grey, -2.5, 3.5, -1.0);
  box(0.09, 0.12, 0.09, M.grey, 2.8, 3.5, -1.6);
})();

/* ---------- rack wall builder ----------
   axis 'z': wall at z=fixed, bays run along X, faces +Z (back wall)
   axis 'x': wall at x=fixed, bays run along Z, faces +X (left wall)
   Each bay: photo-textured back panel + red uprights + shelf boards
   (white, red front edge) + thin glass shelves. Bench below.
   Options: y0/y1 build a horizontal BAND of the wall (default = full
   rack height 0.45..3.35); bench:false skips the bench for a stacked
   band; benchFrom/benchTo let the bench span wider than the band. */
function rackWall(cfg){
  var g = new THREE.Group(); room.add(g);
  var bayW = (cfg.to - cfg.from) / cfg.bays;
  var dir = (cfg.dir == null ? 1 : cfg.dir); /* dir -1: rack extends toward -axis (right wall, x=+6) */
  var rackBot = (cfg.y0 == null ? 0.45 : cfg.y0);
  var rackTop = (cfg.y1 == null ? 3.35 : cfg.y1);
  var rackH = rackTop - rackBot;
  var rowH = rackH / cfg.rows;
  var depth = 0.42, zBack;
  function P(x, y, z){ /* position a part in wall coords */
    if (cfg.axis === 'z') return [x, y, z];
    return [z, y, x]; /* swap: x->z for the x-axis wall */
  }
  function addBox(w, h, d, m, cx, cy, cz){
    var p = P(cx, cy, cz);
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set(p[0], p[1], p[2]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    if (cfg.axis === 'x') mesh.rotation.y = Math.PI/2;
    g.add(mesh); return mesh;
  }
  function addPlane(w, h, m, cx, cy, cz, ry){
    var p = P(cx, cy, cz);
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    mesh.position.set(p[0], p[1], p[2]);
    mesh.rotation.y = (cfg.axis === 'z') ? (dir > 0 ? 0 : Math.PI) : dir * Math.PI/2;
    if (ry) mesh.rotation.y += ry;
    mesh.receiveShadow = true;
    g.add(mesh); return mesh;
  }
  var i, b, r;
  /* back panels, one per bay (photo texture) — at fixed+0.05, NOT +0.02:
     the teal lower wall band's front face sits exactly at fixed+0.02, so
     the old panels were coplanar with it and the bottom two rows
     flickered/flashed on close zoom (Sir, 24 Nov ~12:00). 0.03 gap kills
     the z-fight; invisible at any viewing distance. */
  for (b = 0; b < cfg.bays; b++){
    var cx = cfg.from + bayW * (b + 0.5);
    addPlane(bayW - 0.06, rackH, cfg.tex, cx, rackBot + rackH/2, cfg.fixed + dir * 0.05);
    /* shelf boards + red front edges + glass shelves */
    for (r = 0; r < cfg.rows; r++){
      var sy = rackBot + rowH * (r + 1) - 0.02;
      if (r < cfg.rows - 1){
        addBox(bayW - 0.06, 0.035, depth, M.shelfW, cx, sy, cfg.fixed + dir * 0.21);
        addBox(bayW - 0.06, 0.05, 0.02, M.red, cx, sy + 0.01, cfg.fixed + dir * 0.42);
      }
      /* glass shelf: width runs along the wall, depth into the room */
      var gw = (cfg.axis === 'z') ? (bayW - 0.08) : (depth - 0.04);
      var gh = (cfg.axis === 'z') ? (depth - 0.04) : (bayW - 0.08);
      var gl = new THREE.Mesh(new THREE.PlaneGeometry(gw, gh), M.glassShelf);
      var gp = P(cx, sy + 0.05, cfg.fixed + dir * 0.21); /* was +0.03: only 0.0125 above the shelf-board top (sy+0.0175), shimmered at close zoom — +0.05 gives a clean gap */
      gl.position.set(gp[0], gp[1], gp[2]); gl.rotation.x = -Math.PI/2;
      g.add(gl);
    }
  }
  /* red uprights between + at both ends */
  for (i = 0; i <= cfg.bays; i++){
    var ux = cfg.from + bayW * i;
    addBox(0.07, rackH, 0.46, M.red, ux, rackBot + rackH/2, cfg.fixed + dir * 0.21);
  }
  /* top + bottom rails */
  addBox(cfg.to - cfg.from, 0.07, 0.46, M.red, (cfg.from + cfg.to)/2, rackTop - 0.03, cfg.fixed + dir * 0.21);
  addBox(cfg.to - cfg.from, 0.07, 0.46, M.red, (cfg.from + cfg.to)/2, rackBot + 0.03, cfg.fixed + dir * 0.21);
  /* bench below: wood top + teal front. bench:false skips it (a band
     stacked on another band has no bench of its own); benchFrom/benchTo
     let the bench span wider than this band. */
  if (cfg.bench !== false){
    var bFrom = (cfg.benchFrom == null ? cfg.from : cfg.benchFrom);
    var bTo = (cfg.benchTo == null ? cfg.to : cfg.benchTo);
    var bl = bTo - bFrom, bc = (bFrom + bTo) / 2;
    addBox(bl, 0.07, 0.55, M.wood, bc, 0.42, cfg.fixed + dir * 0.26);
    addBox(bl, 0.38, 0.06, M.teal, bc, 0.2, cfg.fixed + dir * 0.5);
  }
  return g;
}

/* BACK wall (V99) — the wall you face on entering: Sir's count, 24 Nov 12:09
   (BINDING, supersedes the old "6 bays, 9 rows" video reading): 5 across
   (left to right) x 7 down = 35 khane. */
rackWall({axis:'z', fixed:-3, from:-6, to:6, bays:5, rows:7, tex:backMat});
/* small diagonal corner shelf at the top of the east end (above B6) */
(function(){
  var s = box(0.55, 0.05, 0.4, M.shelfW, 5.6, 3.15, -2.75);
  s.rotation.y = -0.6;
  box(0.2, 0.22, 0.18, M.red, 5.55, 3.28, -2.8);
  box(0.18, 0.2, 0.16, M.white, 5.75, 3.28, -2.7);
})();
/* teal-framed glass panel in front of B6 (east end bay) — parallel to the wall */
(function(){
  var g = new THREE.Group(); room.add(g);
  var fr = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.5, 0.06), M.tealFrame);
  fr.position.set(5.0, 1.7, -2.4); fr.castShadow = true; g.add(fr);
  var gl = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.4), M.glass);
  gl.position.set(5.0, 1.7, -2.36); g.add(gl);
  var mid = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.07, 0.08), M.tealFrame);
  mid.position.set(5.0, 1.7, -2.36); g.add(mid);
  /* dark bottles seen through it, lower rows */
  for (var i = 0; i < 4; i++)
    box(0.12, 0.34, 0.12, mat(0x2a1c10, 0.4), 5.25 + (i%2)*0.2, 0.85 + Math.floor(i/2)*0.4, -2.5);
})();

/* LEFT wall (V38) — Sir's count, 24 Nov 10:53 (BINDING, supersedes the
   old "5 bays, 10 rows" count): 8 cols x 7 rows = 41 khane. Top 2 rows
   full 8 (16); rows 3-7 cols 4-8 only (5x5=25); first 3 cols (front/door

/* ---------- camera presets (?cam= for checks) + entry flow ---------- */
var CAMS = {
  entry: {p:[4.2, 1.6, 1.8],  t:[0, 1.5, -1.5]},
  back:  {p:[0, 1.7, -2.2],   t:[0, 1.5, 3]},
  left:  {p:[-4.6, 1.7, 0],   t:[0, 1.5, 0]},
  right: {p:[4.6, 1.7, 0],    t:[0, 1.5, 0]},
  front: {p:[0, 1.7, 2.2],    t:[0, 1.5, -3]},
  top:   {p:[4.5, 3.0, 2.5],  t:[0, 1.0, -1.0]}
};
function setCam(name){
  var c = CAMS[name] || CAMS.entry;
  camera.position.set(c.p[0], c.p[1], c.p[2]);
  controls.target.set(c.t[0], c.t[1], c.t[2]);
  controls.update();
}
var params = new URLSearchParams(window.location.search);
var camName = params.get('cam');
var entryEl = document.getElementById('entry'), entered = false;
function enter(instant){
  if (entered) return; entered = true;
  entryEl.classList.add('open');
  var t0 = performance.now(), dur = instant ? 0 : 1200;
  var from = camera.position.clone(), to = HOME_POS.clone();
  var tgt0 = controls.target.clone(), tgt1 = HOME_TGT.clone();
  function step(now){
    var k = dur === 0 ? 1 : Math.min(1, (now - t0) / dur);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    camera.position.lerpVectors(from, to, e);
    controls.target.lerpVectors(tgt0, tgt1, e);
    if (k < 1) requestAnimationFrame(step);
    else { controls.enabled = true; }
  }
  if (camName && CAMS[camName]){ setCam(camName); controls.enabled = true; entryEl.classList.add('gone'); return; }
  setTimeout(function(){ entryEl.classList.add('gone'); }, instant ? 0 : 650);
  requestAnimationFrame(step);
}
document.getElementById('doorBtn').addEventListener('click', function(){ enter(false); });
if (camName && CAMS[camName]) enter(true);

/* ---------- resize + render loop ---------- */
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();
var clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var dt = Math.min(clock.getDelta(), 0.05);
  if (ceilFanBlades) ceilFanBlades.rotation.y += dt * 1.4;
  if (wallFanBlades) wallFanBlades.rotation.z -= dt * 2.2;
  controls.update();
  clampCamera(); /* Sir, 24 Nov — camera stays inside the room */
  renderer.render(scene, camera);
})();
})();
